<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLB Merge Tool</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: #1a1a2e; color: #e0e0e0; }
  h1 { color: #e94560; }
  fieldset { border: 1px solid #16213e; padding: 15px; margin: 15px 0; border-radius: 8px; background: #16213e; }
  legend { color: #0f3460; font-weight: bold; padding: 0 10px; color: #e94560; }
  label { display: block; margin: 10px 0 5px; color: #a0a0c0; }
  input[type="url"] { width: 100%; padding: 8px; border: 1px solid #0f3460; border-radius: 4px; background: #1a1a2e; color: #e0e0e0; box-sizing: border-box; }
  input[type="url"]:focus { border-color: #e94560; outline: none; }
  button { background: #e94560; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
  button:hover { background: #c73652; }
  button:disabled { background: #555; cursor: not-allowed; }
  #status { margin: 10px 0; padding: 10px; border-radius: 4px; }
  .error { background: #4a1a1a; color: #ff6b6b; }
  .ok { background: #1a4a1a; color: #6bff6b; }
  #renderer { width: 100%; height: 400px; border: 1px solid #0f3460; border-radius: 4px; background: #111; margin: 15px 0; }
  pre { background: #111; padding: 15px; border-radius: 4px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; font-size: 13px; }
  .copy-btn { background: #0f3460; margin-left: 10px; font-size: 13px; padding: 5px 10px; }
</style>
</head>
<body>
<h1>GLB Merge Tool</h1>

<fieldset>
  <legend>Source Models</legend>
  <label for="urlA">Model A (GLB URL)</label>
  <input type="url" id="urlA" placeholder="https://example.com/model-a.glb" value="https://threejs.org/examples/models/gltf/Flamingo.glb">
  <label for="urlB">Model B (GLB URL)</label>
  <input type="url" id="urlB" placeholder="https://example.com/model-b.glb" value="https://threejs.org/examples/models/gltf/Parrot.glb">
</fieldset>

<button id="mergeBtn">Load and Merge</button>

<div id="status"></div>
<div id="renderer"></div>

<h2>Generated Three.js Code</h2>
<pre id="codeBlock">// Click "Load and Merge" to generate the code</pre>
<button id="copyBtn" class="copy-btn">Copy Code</button>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const mergeBtn = document.getElementById('mergeBtn');
const statusEl = document.getElementById('status');
const rendererContainer = document.getElementById('renderer');
const codeBlock = document.getElementById('codeBlock');
const copyBtn = document.getElementById('copyBtn');

let currentGroup = null;
let scene, camera, renderer, controls;

function initRenderer() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111122);

  camera = new THREE.PerspectiveCamera(45, rendererContainer.clientWidth / rendererContainer.clientHeight, 0.1, 100);
  camera.position.set(5, 3, 8);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(rendererContainer.clientWidth, rendererContainer.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  rendererContainer.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  // Lights
  const ambientLight = new THREE.AmbientLight(0x404060);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1);
  dirLight.position.set(5, 10, 7);
  scene.add(dirLight);

  const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.5);
  dirLight2.position.set(-5, -1, -5);
  scene.add(dirLight2);

  // Grid helper
  const gridHelper = new THREE.GridHelper(20, 20, 0x444466, 0x222244);
  scene.add(gridHelper);

  window.addEventListener('resize', onResize);
}

function onResize() {
  if (!renderer) return;
  const w = rendererContainer.clientWidth;
  const h = rendererContainer.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, currentGroup ? scene : new THREE.Scene());
}

function setStatus(text, isError) {
  statusEl.textContent = text;
  statusEl.className = isError ? 'error' : 'ok';
}

function loadModel(url) {
  return new Promise((resolve, reject) => {
    const loader = new GLTFLoader();
    loader.load(url, resolve, undefined, reject);
  });
}

function bboxSize(group) {
  group.updateWorldMatrix(true, false);
  const box = new THREE.Box3().setFromObject(group);
  const size = new THREE.Vector3();
  box.getSize(size);
  return size;
}

async function mergeAndShow() {
  const urlA = document.getElementById('urlA').value.trim();
  const urlB = document.getElementById('urlB').value.trim();

  if (!urlA || !urlB) {
    setStatus('Both URL fields are required.', true);
    return;
  }

  mergeBtn.disabled = true;
  setStatus('Loading models...', false);

  try {
    const [gltfA, gltfB] = await Promise.all([loadModel(urlA), loadModel(urlB)]);
    setStatus('Models loaded. Merging...', false);

    // Remove old merged group if it exists
    if (currentGroup) {
      scene.remove(currentGroup);
      disposeGroup(currentGroup);
    }

    const group = new THREE.Group();

    // Clone scenes to keep originals
    const sceneA = gltfA.scene.clone();
    const sceneB = gltfB.scene.clone();

    // Get bounding boxes to calculate offset
    group.add(sceneA);
    const sizeA = bboxSize(sceneA);
    group.remove(sceneA);

    group.add(sceneB);
    const sizeB = bboxSize(sceneB);
    group.remove(sceneB);

    // Position models side by side along x-axis with a gap
    const gap = 1.0;
    const offsetX = (sizeA.x + sizeB.x) / 2 + gap;

    sceneA.position.x = -offsetX / 2;
    sceneB.position.x = offsetX / 2;

    group.add(sceneA);
    group.add(sceneB);

    scene.add(group);
    currentGroup = group;

    // Center the view on the merged group
    const center = new THREE.Vector3();
    const box = new THREE.Box3().setFromObject(group);
    box.getCenter(center);
    camera.position.set(center.x, center.y + 3, center.z + 8);
    controls.target.copy(center);
    controls.update();

    // Generate code
    const code = generateCode(urlA, urlB);
    codeBlock.textContent = code;

    setStatus('Merge successful: ' + gltfA.scene.children.length + ' + ' + gltfB.scene.children.length + ' objects merged.', false);
  } catch (err) {
    setStatus('Error: ' + (err.message || err), true);
    console.error(err);
  } finally {
    mergeBtn.disabled = false;
  }
}

function generateCode(urlA, urlB) {
  return `// Generated by GLB Merge Tool
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const loader = new GLTFLoader();

async function loadAndMerge() {
  const [gltfA, gltfB] = await Promise.all([
    loader.loadAsync('${urlA}'),
    loader.loadAsync('${urlB}')
  ]);

  const group = new THREE.Group();
  const modelA = gltfA.scene.clone();
  const modelB = gltfB.scene.clone();

  // Position side by side
  modelA.position.x = -2;
  modelB.position.x = 2;

  group.add(modelA);
  group.add(modelB);

  scene.add(group);
}

loadAndMerge();`;
}

function disposeGroup(group) {
  group.traverse((child) => {
    if (child.isMesh) {
      child.geometry?.dispose();
      if (Array.isArray(child.material)) {
        child.material.forEach(m => m.dispose());
      } else {
        child.material?.dispose();
      }
    }
  });
}

// Copy code button
copyBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(codeBlock.textContent).then(() => {
    const origText = copyBtn.textContent;
    copyBtn.textContent = 'Copied!';
    setTimeout(() => copyBtn.textContent = origText, 2000);
  });
});

mergeBtn.addEventListener('click', mergeAndShow);

// Initialize
initRenderer();
animate();
</script>
</body>
</html>
